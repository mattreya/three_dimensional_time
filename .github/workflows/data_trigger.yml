name: Autonomous Data Trigger Bot

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-data-trigger-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure full history and permissions for pushing back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install bot dependencies
        working-directory: projects/data-trigger-bot
        run: uv sync

      - name: Run Data Trigger Bot
        working-directory: projects/data-trigger-bot
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Run google-agents-cli using uv run since dependencies are managed via uv sync
          uv run agents-cli run "Fetch the latest anomaly data from CERN, JWST, and Vera C. Rubin. Formulate a digest and execute the push tool autonomously."